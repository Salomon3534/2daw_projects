<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 id="title">Hola mundo</h1>
    <button id="chng_tit_color">Cambiar color del titulo</button>
    <button id="chng_bg_color">Cambira color del fondo</button>
<script>
    const title = document.getElementById("title")

    const btn_tit_chng = document.getElementById("chng_tit_color")
    const btn_bg_chang = document.getElementById("chng_bg_color")

    btn_bg_chang.addEventListener("click",
        function () {
            document.bgColor = Math.random()
        }
    )

    btn_tit_chng.addEventListener("click",
        function () {
            title.style.color = Math.random()
        }
    )

</script>

</body>
</html>
